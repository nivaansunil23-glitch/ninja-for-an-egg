// AnimalRig in JavaScript: the same build + pose maths as the Luau rig, so the
// preview moves exactly like the game. Pure maths (no three.js) so it can be tested.
const AnimalRigJS = (() => {
  const PHASE = { legFL: 1, legFR: -1, legBL: -1, legBR: 1, legL: 1, legR: -1, armL: -1, armR: 1 };
  const ROLES = ["body", "head", "neck", "jaw", "tail", "seg", "leg", "arm", "wing", "ear", "fin", "hood"];
  const swapSide = (n) => { const i = n.lastIndexOf("L"); return i < 0 ? n : n.slice(0, i) + "R" + n.slice(i + 1); };
  const roleOf = (n) => { for (const r of ROLES) if (n.startsWith(r)) return r; return "other"; };
  const sideOf = (n) => { for (let k = n.length - 1; k >= 0; k--) { if (n[k] === "L") return 1; if (n[k] === "R") return -1; } return 0; };
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

  // 4x4 column-major-free helpers: we store row-major 3x3 R + p, like a CFrame
  const cf = (R, p) => ({ R, p });
  const I3 = [1, 0, 0, 0, 1, 0, 0, 0, 1];
  const mm = (A, B) => { const r = new Array(9); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) r[i * 3 + j] = A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j]; return r; };

      eyesOpen: [], eyesShut: [], brows: [] };

      const name = mirror ? swapSide(a[0]) : a[0];

        base: [mirror ? -a[2] : a[2], a[3], a[4]],

          self.brows.push(addPart(e.node, K, 0.012, s * 0.3, s * 1.3, fx, e.y + s * 0.85, e.z, side * 0.45, 0, 0));
        } else {
          self.eyesOpen.push(addPart(e.node, eye, s, s * 1.15, 0.012, x, e.y, e.z, 0, 0, 0, e.mat));
          self.eyesOpen.push(addPart(e.node, W, s * 0.3, s * 0.3, 0.006, x + s * 0.2, e.y + s * 0.25, e.z + 0.008));
          self.eyesShut.push(addPart(e.node, eye, s * 1.1, s * 0.22, 0.012, x, e.y - s * 0.1, e.z, 0, 0, 0, e.mat));
          self.brows.push(addPart(e.node, K, s * 1.3, s * 0.3, 0.012, x, e.y + s * 0.85, e.z + 0.002, 0, 0, side * 0.45));
        }

    return self;
  }

    for (const p of self.eyesOpen) p.visible = !asleep;
    for (const p of self.eyesShut) p.visible = asleep;
    for (const p of self.brows) p.visible = angry;

  }

  function step(self, dt, mode, speed) {
    dt = Math.min(dt, 0.1);

  // world transform of every part: [{part, R (row-major 3x3), p}]
  function solve(self, pos = [0, 0, 0], heading = 0) {

})();

window.AnimalRigJS = AnimalRigJS;

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { OBJExporter } from "three/addons/exporters/OBJExporter.js";

const R = window.AnimalRigJS, SPEC = window.SPEC, P = window.PREVIEW;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe6f2);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8fb37a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(20, 40, 25); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const ground = new THREE.Mesh(new THREE.CylinderGeometry(60, 60, 1, 8), new THREE.MeshLambertMaterial({ color: 0x8cc36a, flatShading: true }));
ground.position.y = -0.5; ground.receiveShadow = true; scene.add(ground);

const rig = R.build(SPEC, { t: 0, seed: 1 });
const group = new THREE.Group(); group.name = P.name; scene.add(group);
const box = new THREE.BoxGeometry(1, 1, 1);
const mats = new Map();
const matFor = (c, neon) => {
  const key = c.join() + (neon ? "n" : "");
  if (!mats.has(key)) {
    const col = new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255).convertSRGBToLinear();
    mats.set(key, neon ? new THREE.MeshBasicMaterial({ color: col }) : new THREE.MeshLambertMaterial({ color: col, flatShading: true }));
  }
  return mats.get(key);
};
const meshes = rig.parts.map((p, i) => {
  const m = new THREE.Mesh(box, matFor(p.color, p.mat === "Neon"));
  m.name = "Part" + i; m.castShadow = true; m.matrixAutoUpdate = false; group.add(m); return m;
});

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 1000);
const controls = new OrbitControls(camera, renderer.domElement);

let mode = P.modes[0][0];

const scaleM = new THREE.Matrix4(), rot = new THREE.Matrix4();

  const out = R.solve(rig, [0, hover, 0], 0);
  out.forEach((o, i) => {
    const m = meshes[i], s = o.part.size, Rr = o.R;
    rot.set(Rr[0], Rr[1], Rr[2], o.p[0], Rr[3], Rr[4], Rr[5], o.p[1], Rr[6], Rr[7], Rr[8], o.p[2], 0, 0, 0, 1);

    m.visible = o.part.visible;

}
R.step(rig, 0, mode, 0); place();
const bb = new THREE.Box3().setFromObject(group);
const h = Math.max(bb.max.y, 1), w = Math.max(bb.max.x - bb.min.x, bb.max.z - bb.min.z, 1);
const dist = Math.max(h, w) * 1.9 + 2;
camera.position.set(dist * 0.55, h * 0.75 + dist * 0.25, dist * 0.85);
controls.target.set(0, h * 0.45, 0);
sun.shadow.camera.left = sun.shadow.camera.bottom = -dist; sun.shadow.camera.right = sun.shadow.camera.top = dist;

const modesEl = document.getElementById("modes");
const btns = P.modes.map(([m, label], i) => {
  const b = document.createElement("button");
  b.textContent = `${i + 1} ${label}`;
  b.onclick = () => setMode(m);
  modesEl.appendChild(b); return [m, b];
});
function setMode(m) { mode = m; btns.forEach(([k, b]) => b.classList.toggle("on", k === m)); }
setMode(mode);
addEventListener("keydown", (e) => { const i = parseInt(e.key) - 1; if (P.modes[i]) setMode(P.modes[i][0]); });

const download = (blob, name) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); };
document.getElementById("obj").onclick = () => {
  group.updateMatrixWorld(true);
  download(new Blob([new OBJExporter().parse(group)], { type: "text/plain" }), P.name + ".obj");
};
document.getElementById("glb").onclick = () => {
  group.updateMatrixWorld(true);
  new GLTFExporter().parse(group, (res) => download(new Blob([res], { type: "model/gltf-binary" }), P.name + ".glb"),
    (err) => alert("GLB export failed: " + err), { binary: true });
};

const zz = document.getElementById("zz");
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  R.step(rig, dt, mode, speedFor(mode));
  place();
  zz.style.opacity = Math.max(0, rig.W.sleep * 1.4 - 0.4) * (0.6 + 0.4 * Math.sin(performance.now() / 300));
  controls.update();
  renderer.render(scene, camera);
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
